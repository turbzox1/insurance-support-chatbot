name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      LANGSMITH_TRACING: "false"
      LANGFUSE_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,observability]"
      - run: python -m pip check
      - run: ruff check .
      - run: pytest -q
      - run: python -m src.evaluation.evaluation --validate
